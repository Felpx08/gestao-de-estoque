<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1f33"/>
      <stop offset="55%" stop-color="#0f2942"/>
      <stop offset="100%" stop-color="#173b5c"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12324e"/>
      <stop offset="100%" stop-color="#0a1f33"/>
    </linearGradient>
    <linearGradient id="crateLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5fa8d3"/>
      <stop offset="100%" stop-color="#1b4965"/>
    </linearGradient>
    <linearGradient id="crateDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b4965"/>
      <stop offset="100%" stop-color="#0f2942"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#5fa8d3" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#5fa8d3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- fundo -->
  <rect width="1600" height="900" fill="url(#skyGrad)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- piso do galpão -->
  <rect y="700" width="1600" height="200" fill="url(#floorGrad)"/>
  <g stroke="#5fa8d3" stroke-opacity="0.12" stroke-width="2">
    <line x1="0" y1="720" x2="1600" y2="720"/>
    <line x1="0" y1="760" x2="1600" y2="760"/>
    <line x1="0" y1="800" x2="1600" y2="800"/>
    <line x1="0" y1="840" x2="1600" y2="840"/>
  </g>

  <!-- estantes de fundo (silhueta) -->
  <g fill="#0f2942" fill-opacity="0.6">
    <rect x="40" y="380" width="220" height="340" rx="4"/>
    <rect x="300" y="330" width="220" height="390" rx="4"/>
    <rect x="1080" y="330" width="220" height="390" rx="4"/>
    <rect x="1340" y="380" width="220" height="340" rx="4"/>
  </g>
  <g stroke="#5fa8d3" stroke-opacity="0.25" stroke-width="3">
    <line x1="40" y1="460" x2="260" y2="460"/>
    <line x1="40" y1="540" x2="260" y2="540"/>
    <line x1="40" y1="620" x2="260" y2="620"/>
    <line x1="300" y1="420" x2="520" y2="420"/>
    <line x1="300" y1="500" x2="520" y2="500"/>
    <line x1="300" y1="580" x2="520" y2="580"/>
    <line x1="300" y1="660" x2="520" y2="660"/>
    <line x1="1080" y1="420" x2="1300" y2="420"/>
    <line x1="1080" y1="500" x2="1300" y2="500"/>
    <line x1="1080" y1="580" x2="1300" y2="580"/>
    <line x1="1080" y1="660" x2="1300" y2="660"/>
    <line x1="1340" y1="460" x2="1560" y2="460"/>
    <line x1="1340" y1="540" x2="1560" y2="540"/>
    <line x1="1340" y1="620" x2="1560" y2="620"/>
  </g>

  <!-- pilha de caixas (isometricas) em primeiro plano, lado esquerdo -->
  <g transform="translate(120,560)">
    <g transform="translate(0,0)">
      <polygon points="0,40 90,0 180,40 90,80" fill="url(#crateLight)"/>
      <polygon points="0,40 90,80 90,150 0,110" fill="url(#crateDark)"/>
      <polygon points="90,80 180,40 180,110 90,150" fill="#0f2942"/>
      <line x1="0" y1="40" x2="90" y2="80" stroke="#0a1f33" stroke-width="2" stroke-opacity="0.4"/>
    </g>
    <g transform="translate(95,60)">
      <polygon points="0,40 80,0 160,40 80,80" fill="url(#crateDark)"/>
      <polygon points="0,40 80,80 80,150 0,110" fill="#0a1f33"/>
      <polygon points="80,80 160,40 160,110 80,150" fill="#0f2942"/>
    </g>
    <g transform="translate(30,150)">
      <polygon points="0,40 90,0 180,40 90,80" fill="url(#crateLight)"/>
      <polygon points="0,40 90,80 90,150 0,110" fill="url(#crateDark)"/>
      <polygon points="90,80 180,40 180,110 90,150" fill="#0f2942"/>
    </g>
  </g>

  <!-- pallet com caixas, lado direito -->
  <g transform="translate(1180,540)">
    <g transform="translate(0,0)">
      <polygon points="0,40 90,0 180,40 90,80" fill="url(#crateDark)"/>
      <polygon points="0,40 90,80 90,150 0,110" fill="#0a1f33"/>
      <polygon points="90,80 180,40 180,110 90,150" fill="#0f2942"/>
    </g>
    <g transform="translate(95,-40)">
      <polygon points="0,40 80,0 160,40 80,80" fill="url(#crateLight)"/>
      <polygon points="0,40 80,80 80,150 0,110" fill="url(#crateDark)"/>
      <polygon points="80,80 160,40 160,110 80,150" fill="#0f2942"/>
    </g>
    <g transform="translate(20,150)">
      <polygon points="0,40 90,0 180,40 90,80" fill="url(#crateDark)"/>
      <polygon points="0,40 90,80 90,150 0,110" fill="#0a1f33"/>
      <polygon points="90,80 180,40 180,110 90,150" fill="#0f2942"/>
    </g>
    <!-- pallet base -->
    <g transform="translate(0,235)" stroke="#5fa8d3" stroke-opacity="0.4" stroke-width="4">
      <line x1="-10" y1="0" x2="230" y2="0"/>
      <line x1="-10" y1="16" x2="230" y2="16"/>
      <line x1="-10" y1="32" x2="230" y2="32"/>
    </g>
  </g>

  <!-- caixa isolada central, mais próxima, leve destaque -->
  <g transform="translate(690,620)" opacity="0.9">
    <polygon points="0,50 110,0 220,50 110,100" fill="url(#crateLight)"/>
    <polygon points="0,50 110,100 110,190 0,140" fill="url(#crateDark)"/>
    <polygon points="110,100 220,50 220,140 110,190" fill="#0f2942"/>
    <line x1="0" y1="50" x2="220" y2="50" stroke="#5fa8d3" stroke-opacity="0.3" stroke-width="2"/>
  </g>

  <!-- particulas / pontos de luz sutil -->
  <g fill="#5fa8d3" fill-opacity="0.35">
    <circle cx="200" cy="150" r="2.5"/>
    <circle cx="420" cy="90" r="2"/>
    <circle cx="760" cy="60" r="2"/>
    <circle cx="1020" cy="120" r="2.5"/>
    <circle cx="1300" cy="80" r="2"/>
    <circle cx="1450" cy="180" r="2.5"/>
    <circle cx="90" cy="260" r="1.8"/>
    <circle cx="1520" cy="260" r="1.8"/>
  </g>

  <!-- vinheta escura nas bordas para contraste do card -->
  <rect width="1600" height="900" fill="#0a1f33" fill-opacity="0.15"/>
</svg>
